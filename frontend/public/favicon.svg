<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="kPillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffaa40"/>
      <stop offset="100%" stop-color="#f05a0d"/>
    </linearGradient>
    <linearGradient id="kChevron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffbe4d"/>
      <stop offset="50%" stop-color="#fa7a1a"/>
      <stop offset="100%" stop-color="#db3808"/>
    </linearGradient>
  </defs>
  
  <!-- Base Squircle -->
  <rect x="1" y="1" width="30" height="30" rx="6.8" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="30" height="30" rx="6.8" fill="none" stroke="url(#borderGrad)" stroke-width="0.75"/>
  
  <!-- Knowledge Pillar -->
  <rect x="7.25" y="6.75" width="3.75" height="18.5" rx="1.875" fill="url(#kPillar)"/>
  
  <!-- Retrieval Chevron -->
  <path d="M 23 7.75 L 13.5 16 L 23 24.25" fill="none" stroke="url(#kChevron)" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
