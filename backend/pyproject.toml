[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-llmops-backend"
version = "0.1.0"
description = "Production-ready Advanced RAG with Automated Evaluation & Observability on AWS Bedrock"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "boto3>=1.34.0",
    "langfuse>=2.20.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "rank-bm25>=0.2.2",
    "pypdf>=4.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
